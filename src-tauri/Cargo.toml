[package]
name = "mudae-crop"
version = "0.1.0"
description = "Local Mudae card editor"
authors = ["PHSebastiao"]
edition = "2021"

[lib]
name = "mudae_crop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["stream"] }
futures-util = "0.3"
